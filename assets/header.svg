<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Augusto — pdaugusto</title>
  <desc id="desc">Assinatura em preto e branco com retícula inspirada na foto do perfil e uma linha de luz em movimento lento.</desc>
  <style>
    .halftone { animation: breathe 9s ease-in-out infinite; }
    .trace { stroke-dasharray: 85 750; animation: trace 12s linear infinite; }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
    @keyframes trace { to { stroke-dashoffset: -835; } }
    @media (prefers-reduced-motion: reduce) { .halftone, .trace { animation: none; } }
  </style>
  <rect width="1000" height="340" fill="#080808"/>
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.6" fill="#ddd"/></pattern>
    <radialGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#aaa"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="soft"><rect x="670" y="20" width="300" height="220" fill="url(#fade)"/></mask>
  </defs>
  <g class="halftone" mask="url(#soft)">
    <rect x="670" y="20" width="300" height="220" fill="url(#dots)"/>
  </g>
  <text x="48" y="126" fill="#f5f5f5" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-2">Pedro</text>
  <text x="45" y="207" fill="#f5f5f5" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-style="italic" letter-spacing="-2">Augusto.</text>
  <path d="M48 247H950" stroke="#333"/>
  <path class="trace" d="M48 247H950" stroke="#ddd" fill="none"/>
  <text x="48" y="291" fill="#b0b0b0" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">@PDAUGUSTO</text>
  <text x="950" y="291" text-anchor="end" fill="#b0b0b0" font-family="Arial, Helvetica, sans-serif" font-size="14">Vitória da Conquista · Bahia</text>
</svg>
